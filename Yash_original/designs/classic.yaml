design:
  theme: sb2nov
  page:
    size: us-letter
    top_margin: 1.4cm
    bottom_margin: 1.4cm
    left_margin: 1.6cm
    right_margin: 1.6cm
    show_footer: false
    show_top_note: false
  colors:
    body: rgb(0, 0, 0)
    name: rgb(0, 0, 0)
    headline: rgb(0, 0, 0)
    connections: rgb(0, 0, 0)
    section_titles: rgb(0, 0, 0)
    links: rgb(0, 0, 0)
  typography:
    line_spacing: 0.45em
    font_family:
      body: XCharter
      name: XCharter
      headline: XCharter
      connections: XCharter
      section_titles: XCharter
    font_size:
      body: 9.6pt
      name: 18pt
      headline: 9.6pt
      connections: 9.6pt
      section_titles: 11.5pt
    bold:
      name: true
      headline: false
      connections: false
      section_titles: true
  section_titles:
    space_above: 12pt
    space_below: 4pt
  sections:
    space_between_regular_entries: 6pt
    space_between_text_based_entries: 2pt
  entries:
    allow_page_break: true
    highlights:
      bullet: "●"
      nested_bullet: "●"
      space_above: 1pt
      space_between_items: 1pt
  templates:
    footer: ""
    single_date: MONTH_ABBREVIATION YEAR
    date_range: START_DATE – END_DATE
    experience_entry:
      main_column: |-
        **POSITION**
        DATE
        HIGHLIGHTS
      date_and_location_column: |-
        **COMPANY**
        LOCATION
